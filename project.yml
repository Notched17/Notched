# SPDX-License-Identifier: GPL-3.0-or-later
# DynamicNotch is generated with XcodeGen. Never edit the .xcodeproj by hand:
# change this file and run `xcodegen generate`.
name: DynamicNotch

options:
  bundleIdPrefix: me.rkck
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: N84NGFQ5R9
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_APP_SANDBOX: NO

targets:
  DynamicNotch:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.DynamicNotch
        PRODUCT_NAME: DynamicNotch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DynamicNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Charlie Auchter. Free software under the GNU GPL v3 or later."
        CFBundleURLTypes:
          - CFBundleURLName: me.rkck.DynamicNotch
            CFBundleURLSchemes: [dynamicnotch]
        # Usage strings for later milestones. They do nothing until a module
        # the user has turned on actually requests the permission.
        NSAppleEventsUsageDescription: "DynamicNotch controls Music and Spotify and reads what's playing when you turn on Now Playing."
        NSCalendarsFullAccessUsageDescription: "DynamicNotch shows your upcoming events in the island when you turn on Calendar."
        NSRemindersFullAccessUsageDescription: "DynamicNotch shows and completes today's reminders when you turn on Reminders."
        NSBluetoothAlwaysUsageDescription: "DynamicNotch shows when your headphones and other Bluetooth devices connect."
        NSLocationWhenInUseUsageDescription: "DynamicNotch uses your approximate location to show local weather."
        NSLocationUsageDescription: "DynamicNotch uses your approximate location to show local weather."
        NSAudioCaptureUsageDescription: "DynamicNotch listens to the audio that's playing so the visualiser can move with the music."

  DynamicNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DynamicNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.DynamicNotchTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DynamicNotch.app/Contents/MacOS/DynamicNotch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DynamicNotch:
    build:
      targets:
        DynamicNotch: all
        DynamicNotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DynamicNotchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
