# SPDX-License-Identifier: GPL-3.0-or-later
# Notched is generated with XcodeGen. Never edit the .xcodeproj by hand:
# change this file and run `xcodegen generate`.
name: Notched

options:
  bundleIdPrefix: me.rkck
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: N84NGFQ5R9
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_APP_SANDBOX: NO

packages:
  # Global hot key for clipboard history (#45). MIT; see THIRD_PARTY_NOTICES.md.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.2.0

targets:
  Notched:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # mediaremote-adapter (#10): the Perl entry point ships as a resource;
      # its framework and test client are built from Vendor/ below.
      - path: Vendor/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      # Bundled for /usr/bin/perl to load, never linked into the app.
      - target: MediaRemoteAdapter
        link: false
        embed: true
        codeSign: true
      - target: MediaRemoteAdapterTestClient
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The Claude Code hook helper (#63). The app copies it to ~/.local/bin.
      - target: notched-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.Notched
        CODE_SIGN_ENTITLEMENTS: App/Notched.entitlements
        PRODUCT_NAME: Notched
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notched
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Charlie Auchter. Free software under the GNU GPL v3 or later."
        CFBundleURLTypes:
          - CFBundleURLName: me.rkck.Notched
            CFBundleURLSchemes: [notched]
        # Usage strings for later milestones. They do nothing until a module
        # the user has turned on actually requests the permission.
        NSAppleEventsUsageDescription: "Notched controls Music and Spotify and reads what's playing when you turn on Now Playing."
        NSCalendarsFullAccessUsageDescription: "Notched shows your upcoming events in the island when you turn on Calendar."
        NSRemindersFullAccessUsageDescription: "Notched shows and completes today's reminders when you turn on Reminders."
        NSBluetoothAlwaysUsageDescription: "Notched shows when your headphones and other Bluetooth devices connect."
        NSLocationWhenInUseUsageDescription: "Notched reads your Wi-Fi network's name when you turn that on for Network, and later your approximate location for local weather. macOS shares Wi-Fi names only with apps allowed to use Location."
        NSLocationUsageDescription: "Notched reads your Wi-Fi network's name when you turn that on for Network, and later your approximate location for local weather. macOS shares Wi-Fi names only with apps allowed to use Location."
        NSDownloadsFolderUsageDescription: "Notched shows the progress of your downloads when you turn on Downloads."
        NSAudioCaptureUsageDescription: "Notched listens to the audio that's playing so the visualiser can move with the music."

  # ungive/mediaremote-adapter (BSD-3-Clause), vendored unmodified in
  # Vendor/mediaremote-adapter. Built here instead of with its CMake file so
  # it is signed with the app's identity (see Vendor/mediaremote-adapter/NOTCHED.md).
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src/adapter
      - path: Vendor/mediaremote-adapter/src/private
      - path: Vendor/mediaremote-adapter/src/utility
      - path: Vendor/mediaremote-adapter/include
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.Notched.MediaRemoteAdapter
        MARKETING_VERSION: "0.7.7"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # The Perl script calls the framework's functions by name.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: ["-fvisibility=default"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/mediaremote-adapter/src"
          - "$(SRCROOT)/Vendor/mediaremote-adapter/include"
        # Third-party code: don't fail the build on its warnings.
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES

  MediaRemoteAdapterTestClient:
    type: tool
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src/test
    dependencies:
      - sdk: Foundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapterTestClient
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.Notched.MediaRemoteAdapterTestClient
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES

  notched-hook:
    type: tool
    platform: macOS
    sources:
      - path: Tools/notched-hook
    settings:
      base:
        PRODUCT_NAME: notched-hook
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.Notched.hook
        # A tiny script-like tool: Swift 5 mode avoids top-level-code isolation friction.
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  NotchedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Notched
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rkck.NotchedTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notched.app/Contents/MacOS/Notched"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Notched:
    build:
      targets:
        Notched: all
        NotchedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchedTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
